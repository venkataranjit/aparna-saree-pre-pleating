<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/lady-logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#000000" />
    <title>Aparna Saree Pre-Pleating</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aparna_app_theme');
          if (saved && (saved === 'dark' || saved === 'light' || saved === 'default')) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'default');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'default');
        }
      })();
    </script>
    <!-- Google Fonts for Material UI & Dashboard -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    />
    <!-- Base Viewport & Theme Styles -->
    <style>
      html,
      body,
      #root {
        background-color: #000000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      [data-theme="dark"],
      [data-theme="dark"] #root {
        background-color: #0f1117;
      }
      [data-theme="light"],
      [data-theme="light"] #root {
        background-color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
